# 复制为 config/k3-auto.local.toml，chmod 600；只编辑这一份本地配置。
# 此模板只含空值/通用默认值，不要在受 Git 跟踪的文件里填现场信息。
[jump]
host = ""
port = 22
user = ""
password = ""                  # 留空使用 SSH key/agent
sudo_password = ""             # 留空复用 password
identity_file = ""
strict_host_key = "accept-new"
repo = ""                      # 跳板机实验仓库绝对路径

[board]
host = ""
user = ""
password = ""
identity_file = ""

[serial]
relay = "/dev/ttyUSB0"
debug = "/dev/ttyUSB1"
debug_baud = 115200

[lan]
jump_nic = ""                  # 现场网络记录；k3ctl 不自动配置网络
board_nic = ""
subnet = ""

[lab]
tftp_root = "/srv/tftp"
log_dir = "logs"
monitor_seconds = 600

[scripts]
power = "./k3-power.sh"
minicom = "./k3-minicom.sh"
minicom_log = "./minicom-log.sh"
boot = "tmp/k3_boot_setup.py"
unixbench = "tmp/k3_unixbench_evidence.py"
lmbench = "tmp/k3_lmbench_0907.py"
python = "/usr/bin/python3"
